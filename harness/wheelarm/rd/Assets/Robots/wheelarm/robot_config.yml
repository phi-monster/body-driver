# body-driver wheelarm rig (大并行 §2 第 39 条,路 8):两轮差速底盘 + 一条五关节的胳膊 + 平行两指;前眼在底盘前沿,腕眼在掌上,没有头顶眼。
# 身体报的、收的就是关节,分三组照实报:胳膊五个关节(RoboDojo 的 arm 那一组)、手指(ee 那一组)、两个轮子的转角(连续转、没有限位;
# 单独一组 base_joint_state,任务模块用 task/RoboDojo/bd/rig.py 的 joint_group 补上 —— 真的轮式底盘,轮子和胳膊本来就是两套控制器)。
# 第一版把轮子塞进胳膊那一串,开机认组:"第0 组(7 个数):零件(长在哪儿量不出)… 认组完:0 条臂"。驱动不知道哪一组是轮子。
# 几何、质量见 harness/wheelarm/make_wheelarm.py;执行器(刚度、阻尼)见 env/robot_manager/robot_config/wheelarm.py。
urdf_path: ./wheelarm.urdf
base_link: base_link
ee_type: gripper
dual_arm: false
delta_matrix:
- [1, 0, 0]
- [0, 1, 0]
- [0, 0, 1]
global_trans_matrix:
- [1, 0, 0]
- [0, 1, 0]
- [0, 0, 1]
grasp_camera_reference_axis: [1, 0, 0]
sides:
  left:
    ee_joints: arm_joint5
    ee_link: gripper_link
    arm_joints_name:
    - arm_joint1
    - arm_joint2
    - arm_joint3
    - arm_joint4
    - arm_joint5
    gripper_joints_name:
    - finger_left_joint
    - finger_right_joint
    gripper_move:
      base: finger_left_joint
      sign: 1.0
      mimic: [finger_right_joint, -1.0, 0.0]
    gripper_bias: 0.0
    gripper_scale: [0.0, 0.04]
    curobo: curobo_left.yml
    # 相机看的是自己的 −Z、画面上方是自己的 +Y;ori 是欧拉角(度),相对挂的那一节,按 RoboDojo 的 utils/rotations.py
    # euler_angles_to_quat 的默认 —— 内旋 XYZ(scipy 的 "XYZ";它的说明写着默认外旋,参数默认其实是 extrinsic=False):
    #   前眼:朝底盘正前方、往下 15°,画面上方 ≈ 底盘的 +z ⇒ [0, −75, −90](和 x5 腕眼的 [0, −80, −90] 一个样式)
    #   腕眼:顺着手指看(零位时手指朝 +z),画面上方 = 掌的 +x(镜头那一侧)⇒ [180, 0, −90]
    #   第一版 [0, 0, 0] 前眼朝下贴着地、腕眼朝回看着小臂;第二版按外旋算的 [75, 0, −90] 前眼朝左看
    camera:
    - link: base_link
      name: cam_front
      type: d435
      mesh: pinhole
      pos: [0.19, 0.0, 0.065]
      ori: [0, -75, -90]
    - link: gripper_link
      name: cam_wrist
      type: d435
      mesh: pinhole
      pos: [0.125, 0.0, 0.664]
      ori: [180, 0, -90]
