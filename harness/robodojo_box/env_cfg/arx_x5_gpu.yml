# Development runs only (10-09): the official arx_x5 robot, scene, cameras and rates, with physics on
# the GPU (sim_gpu) instead of the CPU, the official default. Exam and acceptance runs keep arx_x5.
config_name: arx_x5

config:
  sim: sim_gpu
  scene: default
  robot: dual_x5
  camera: camera_config

observation:
  collect_freq: 25
  robot:
    joint_states: true
    world_ee_state: true
  vision:
    approximate_depth: false
    depth: false
    intrinsic_matrix: false
    extrinsic_matrix: false
    shape: true
