# body-driver walking humanoid rig (大并行 §2 第 40 条,路 8):Isaac 资产库的 Unitree G1(Robots/Unitree/G1/g1.usd,29 个身体关节 + 两只三指手 Dex3),
# 根不固定、站在地上。两条腿归厂商那一侧的走路控制器(Isaac Lab 的 Agile 下半身策略,收 [vx, vy, wz, 胯高]),不归这里的两条胳膊;
# 腰三个关节按默认姿势拿着。身体报的、收的:两条胳膊各 7 个关节、两只手各 7 个关节(每根手指的每一节,照手本来的样子,不并成一个夹爪)、
# 走路控制器的命令那一组(4 个,见 task bd_livingroom.py)、三只眼(头上一只、两只手腕上各一只)。
urdf_path: ./g1.urdf
base_link: pelvis
ee_type: hand
dual_arm: true
delta_matrix:
- [1, 0, 0]
- [0, 1, 0]
- [0, 0, 1]
global_trans_matrix:
- [1, 0, 0]
- [0, 1, 0]
- [0, 0, 1]
grasp_camera_reference_axis: [1, 0, 0]
sides:
  left:
    ee_joints: left_wrist_yaw_joint
    ee_link: left_wrist_yaw_link
    arm_joints_name: [left_shoulder_pitch_joint, left_shoulder_roll_joint, left_shoulder_yaw_joint, left_elbow_joint,
                      left_wrist_roll_joint, left_wrist_pitch_joint, left_wrist_yaw_joint]
    gripper_joints_name: [left_hand_thumb_0_joint, left_hand_thumb_1_joint, left_hand_thumb_2_joint, left_hand_index_0_joint,
                          left_hand_index_1_joint, left_hand_middle_0_joint, left_hand_middle_1_joint]
    gripper_move: {base: left_hand_index_0_joint, sign: 1.0, mimic: []}
    gripper_bias: 0.0
    gripper_scale: [0.0, 1.0]
    curobo: curobo_left.yml
    # 相机:内旋 XYZ 欧拉角(度,RoboDojo utils/rotations.py 的默认),相机看自己的 −Z。腕眼照 RoboDojo 那具固定在桌边的 G1 的装法:
    # 挂在手腕最后一节上方 8 cm、顺着手的方向往下 35°(第一版离手 6 cm、往下 15°:P8XH2 的左腕眼一大半是自己的手,驱动说"看不出")
    camera:
    - link: left_wrist_yaw_link
      name: cam_wrist
      type: d435
      mesh: pinhole
      pos: [0.0, 0.0, 0.08]
      ori: [0, -55, -90]
  right:
    ee_joints: right_wrist_yaw_joint
    ee_link: right_wrist_yaw_link
    arm_joints_name: [right_shoulder_pitch_joint, right_shoulder_roll_joint, right_shoulder_yaw_joint, right_elbow_joint,
                      right_wrist_roll_joint, right_wrist_pitch_joint, right_wrist_yaw_joint]
    gripper_joints_name: [right_hand_thumb_0_joint, right_hand_thumb_1_joint, right_hand_thumb_2_joint, right_hand_index_0_joint,
                          right_hand_index_1_joint, right_hand_middle_0_joint, right_hand_middle_1_joint]
    gripper_move: {base: right_hand_index_0_joint, sign: 1.0, mimic: []}
    gripper_bias: 0.0
    gripper_scale: [0.0, 1.0]
    curobo: curobo_right.yml
    camera:
    - link: right_wrist_yaw_link
      name: cam_wrist
      type: d435
      mesh: pinhole
      pos: [0.0, 0.0, 0.08]
      ori: [0, -55, -90]
