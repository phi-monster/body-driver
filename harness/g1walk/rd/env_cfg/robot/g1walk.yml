# body-driver walking humanoid rig (大并行 §2 第 40 条,路 8): Unitree G1 standing free on the living-room floor (pelvis 0.75 m above the floor), facing +y.
# default_root_pos below is a placeholder: harness/g1walk/install.py writes the start from make_livingroom_layout.py (ROBOT_START, FLOOR_Z).
robots:
  - {
    robot_type: arm,
    robot_name: g1walk,
    coupled: True,
    default_root_pos: [0.0, -0.6, 0.80],
    default_root_rot: [0.7071068, 0, 0, 0.7071068],
    grasp_perfect_direction: "top_down",
    enabled_self_collisions: False
  }
