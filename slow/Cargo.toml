[package]
name    = "body-layer"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "body layer -- the slow face: measure the body, store it with provenance, judge expiry, REFUSE."
license = "AGPL-3.0-or-later"   # copyleft + commercial licence + per-unit royalty; see ../README.md

[lib]
name       = "body_layer"
crate-type = ["staticlib", "cdylib", "rlib"]   # staticlib/cdylib so the C ABI is consumable by anyone

[features]
# Default is std so `cargo test` works out of the box.  `--no-default-features` builds the same
# code for an embedded target: this layer has to run on the robot, not only on a workstation.
default = ["std"]
std = []
# `fast` links the PROVEN Ada core.  Off by default only so the pure-Rust tests run on a machine
# without a GNAT toolchain -- it never substitutes a Rust reimplementation of the safety rules.
fast = []

[dependencies]
# 🔴 none, on purpose.  This layer is what the whole field is invited to read and audit; every
# dependency is a thing an auditor must also read.  It also must build for embedded targets where
# a std-heavy dependency tree is not available.

[profile.release]
panic       = "abort"   # a panic in the body layer is a fault, never a recoverable condition
overflow-checks = true  # keep them ON in release: a silent wrap here is a wrong body constant
lto         = true
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs           = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
