urdf_path: "./panda.urdf"
srdf_path: "./panda.srdf"
ee_joints: "panda_hand_joint"
ee_link: "panda_hand"
ee_type: "gripper"
arm_joints_name: ['panda_joint1', 'panda_joint2', 'panda_joint3', 'panda_joint4', 'panda_joint5', 'panda_joint6', 'panda_joint7']
gripper_joints_name: ['panda_finger_joint1', 'panda_finger_joint2']
gripper_move:
    base: "panda_finger_joint1"
    sign: 1.0
    mimic: ["panda_finger_joint2", 1., 0.]
gripper_bias: 0.102
gripper_scale: [-0.01, 0.04]
delta_matrix: [[0,0,1],[0,-1,0],[1,0,0]]
global_trans_matrix: [[1,0,0],[0,-1,0],[0,0,-1]]
dual_arm: False
base_link: "panda_link0"
grasp_camera_reference_axis: [1, 0, 0] # in base_link frame
rotate_lim: [0.0, 0.8]

# 🔴 腕部相机(2026-08-24)。官方双臂 X5 的 robot_config.yml 里就有一个(挂在腕上),
# 而 franka 这份没有 —— 于是爪子只能靠头相机看,而头相机在正上方、手朝正下方时
# 两指是**端着看**的、前后重叠,张开方向被投影压扁到近零(文档已记过这条),
# 钳口那一格因此四次量不出来(双响恒 0)。腕相机看爪子天然侧视,不存在这个死角。
# 格式照抄 x5/robot_config.yml 的 camera 段,link 换成 franka 的手部 link。
camera:
  -
    link: "panda_hand"
    name: "cam_wrist"
    type: d435
    mesh: pinhole
    # 🔴🔴🔴 **渲图 + 驱动自检双重挑出来的,不是算出来的。**(2026-08-29)
    #
    # 老版 pos [0,-0.12,-0.04] / ori [140,0,0],注释写着"朝向按几何算" —— 算了没看。
    # 它架在**手指张开的那条轴(±Y)上**、离手掌 7 cm ⇒ 手掌外壳糊满画面,
    # **一根手指都拍不到**。一整天的"认不出爪子/两指中间是噪声/收尾取到地板"全源于此。
    #
    # 量出来的两条:相机"正前方"是 **+Z**(不是 USD 默认的 −Z);绕 Y **正角**转向 +X。
    # 悬臂长度是**实测踩出来的**:25 cm ⇒ 手低头时扎进地板全黑;15 cm ⇒ 扎进牛仔裤。
    # ⇒ 收到 6 cm(贴着手掌),朝前 30° 越过指尖看工作区 —— 真机手眼相机就是这么装的。
    # 选角度的办法:一炮挂 4 台候选,读驱动自己那句 (冻住胳膊只动手指,
    # 画面里有东西动才算看得见)⇒ [true,**false**,**true**,true,**false**],这一组是 true 的那个。
    pos: [-0.06, 0, 0.03]
    ori: [0, 30, 0]
