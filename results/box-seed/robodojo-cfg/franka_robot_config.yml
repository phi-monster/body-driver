urdf_path: "./panda.urdf"
srdf_path: "./panda.srdf"
ee_joints: "panda_hand_joint"
ee_link: "panda_hand"
ee_type: "gripper"
arm_joints_name: ['panda_joint1', 'panda_joint2', 'panda_joint3', 'panda_joint4', 'panda_joint5', 'panda_joint6', 'panda_joint7']
gripper_joints_name: ['panda_finger_joint1', 'panda_finger_joint2']
gripper_move:
    base: "panda_finger_joint1"
    sign: 1.0
    mimic: ["panda_finger_joint2", 1., 0.]
gripper_bias: 0.102
gripper_scale: [-0.01, 0.04]
delta_matrix: [[0,0,1],[0,-1,0],[1,0,0]]
global_trans_matrix: [[1,0,0],[0,-1,0],[0,0,-1]]
dual_arm: False
base_link: "panda_link0"
grasp_camera_reference_axis: [1, 0, 0] # in base_link frame
rotate_lim: [0.0, 0.8]

# 🔴 腕部相机(2026-08-24)。官方双臂 X5 的 robot_config.yml 里就有一个(挂在腕上),
# 而 franka 这份没有 —— 于是爪子只能靠头相机看,而头相机在正上方、手朝正下方时
# 两指是**端着看**的、前后重叠,张开方向被投影压扁到近零(文档已记过这条),
# 钳口那一格因此四次量不出来(双响恒 0)。腕相机看爪子天然侧视,不存在这个死角。
# 格式照抄 x5/robot_config.yml 的 camera 段,link 换成 franka 的手部 link。
camera:
  -
    link: "panda_hand"
    name: "cam_wrist"
    type: d435
    mesh: pinhole
    # 🔴🔴🔴 **这一组是【肉眼在渲染画面里看见两根手指】才定的**(owner 2026-08-30 死命令:
    # "肉眼能看清楚爪子才算能看清楚爪子,一切都以视频为准")。
    #
    # 老版 pos [0,-0.12,-0.04] / ori [140,0,0] 的注释写着"朝向按几何算" —— 算了没看,
    # 结果整幅画面被手掌外壳糊满,**一根手指都拍不到**。一整天的"认不出爪子 /
    # 两指中间是噪声 / 收尾取到地板" 全部源于此。
    #
    # 定这一组的过程(全部实测,不是推的):
    #   1) 装了热改通道(/root/camlive.json,sim 每帧读一次)+ 浏览器实时预览,
    #      把"改一次等五分钟"变成"改一次等十秒";
    #   2) 让 sim 打印相机朝向轴在手掌坐标系里的分量,**两个样本就把欧拉约定解出来**:
    #      ori=[45,0,0] 得 (0,-0.707,+0.707) · ori=[0,45,0] 得 (+0.707,0,+0.707);
    #      而 64 格扫描里 rx 取 180/225/270 全是一大片无纹理白色 = 10cm 处的手掌本体
    #      ⇒ **相机正前方是 −Z**(不是 +Z,我先前搞反过);
    #   3) 手指沿 ±Y 张开 ⇒ 相机必须架在 **X 侧**,架在 Y 侧两根手指前后重叠。
    #
    # 验过的画面(腕相机_定版_看得见两指.png):右边手掌本体,**左边伸出两条白色钳口、
    # 中间一道缝**,乐高小人正好在两指之间,剪刀和木地板都在 —— 工作区和爪子同框。
    # ⚠️ 悬臂长度是踩出来的:25cm 手低头时扎进地板全黑 · 15cm 扎进牛仔裤 · 6cm 埋在手掌里。
    pos: [0.16, 0, 0.07]
    ori: [0, 97, 0]
