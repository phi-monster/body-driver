[package]
name    = "contact-gen"
version = "0.1.0"
edition = "2021"
description = "2a -- given a surface and a measured body, which contact sets can THIS body use. Pure geometry, zero learning."
license = "AGPL-3.0-or-later"

# 🔴 依赖表是空的,和 body-layer 同一条理由:这一层是要被整个领域读和审的。
# 🔴 也【不依赖 body-layer】—— 身体常数是参数,是传进来的,不是这里读出来的。
#    ARCH.md §二 那堵墙:反向依赖一出现,"换机体不重训"就没有机制保证了。
[dependencies]
# 🔴 接触集的词汇表 —— ②a 产出它,②b 消费它。它住在自己那儿,两边平级。
contact-set = { path = "../contact-set" }

[profile.release]
overflow-checks = true
lto = true


# 🔴 **只在测试里**依赖 ②b。理由:那条"点云 → 接触集 → 航点 → 推演"的全链验收
# 必须两边都在场才跑得起来。**运行期依赖仍然是空的** —— ②a 与 ②b 平级这堵墙没破。
[dev-dependencies]
contact-exec = { path = "../contact-exec" }
